<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひだまりグループ 勤怠データ（社労士用）</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="app" style="padding:24px 16px;">
  <div class="brand">
    <img src="icon-192.png" alt="" class="brand-icon">
    <h1>ひだまりグループ</h1>
    <p class="brand-sub">勤怠データ（社労士用）</p>
    <p class="muted">DC宮原 ／ ひだまり倶楽部</p>
  </div>
  <div class="card">
    <h2>ログイン</h2>
    <label class="field"><span>メールアドレス</span>
      <input type="email" id="loginId" inputmode="email" autocomplete="username"
             autocapitalize="off" spellcheck="false"></label>
    <label class="field"><span>パスワード</span>
      <input type="password" id="loginPw" autocomplete="current-password"></label>
    <button class="btn primary block" id="btnLogin">ログイン</button>
    <p class="muted center" style="margin:14px 0 0;">
      IDとパスワードは、ひだまりグループ総務部よりお伝えしたものです。</p>
  </div>
</div>

<div id="app" class="app" style="display:none;">
  <div class="topbar">
    <div>
      <h1>勤怠データ</h1>
      <div class="sub" id="whoami"></div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <input type="month" id="monthPick" style="width:150px;">
      <button class="btn sm ghost" id="btnLogout">ログアウト</button>
    </div>
  </div>
  <div id="body" class="view active"><div class="loading">読み込み中…</div></div>
</div>

<div id="sheetBg" class="sheet-bg"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="sr.js"></script>
</body>
</html>
